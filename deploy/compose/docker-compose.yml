# 엔진 서버 하나. (FR-15)
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   PIKA_ENV_TARGET=127.0.0.1:50051 uv run --directory trainer-python pytest
#
# 전송이 둘인 이유:
#   UDS  — 같은 호스트/파드 안의 클라이언트용. 볼륨 engine-socket 으로 나눈다.
#          Phase 9 에서 학습기를 사이드카로 붙이면 이 경로를 쓴다.
#   TCP  — 호스트에서 붙는 길. **macOS 에서는 바인드 마운트 UDS 가 동작하지 않으므로**
#          개발 기계에서 컨테이너에 붙는 유일한 길이기도 하다.
#
# ⚠️ 서버에는 인증이 없다. 포트를 127.0.0.1 에만 묶는다.

services:
  engine:
    build:
      context: ../..
      dockerfile: deploy/compose/engine-server.Dockerfile
    image: pika-engine-server:dev
    command: ["--uds", "/run/pika/engine.sock", "--port", "50051"]
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - engine-socket:/run/pika
    healthcheck:
      # JRE 이미지에 grpc 도구가 없다. 포트가 열렸는지만 본다 — 계약 검증은
      # 클라이언트가 Health 로 한다 (레이아웃 해시 대조, env_client.py).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/50051'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  # 소켓을 나누기 위한 볼륨이다. **상태를 담지 않는다** — 서버는 디스크에
  # 아무것도 남기지 않고, 재시작 후 같은 Configure 면 같은 결과가 나온다.
  engine-socket:
