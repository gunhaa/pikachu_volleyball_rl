# 버전 단일 정의. 모듈 빌드 파일은 여기만 참조한다.

[versions]
kotlin = "2.4.20"
junit = "6.1.3"
jvm = "21"
# gRPC 는 grpc-java 만 쓴다. grpc-kotlin 을 쓰지 않는 이유는 plan.md §7.2
# (최신 릴리스가 약 1년 정지했고, 코드 생성기가 하나 더 붙는다).
grpc = "1.84.0"
protobuf = "4.36.2"
protobufPlugin = "0.9.5"
# analysis 모듈 전용 (Phase 4). GPLv2 + Universal FOSS Exception — 로컬 분석 도구로만 쓰고 배포하지 않는다.
# 문제가 되면 MariaDB Connector/J(LGPL) 로 바꾼다 — JDBC 라 드라이버 한 줄이다 (PRD §7).
mysqlConnector = "9.3.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
# protoc / protoc-gen-grpc-java 는 실행 파일이라 artifact 로 받는다 (protobuf 플러그인이 해석한다).
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
# grpc-stub 이 생성 코드에서 쓰는 javax.annotation.Generated 를 JDK 9+ 에서 채운다.
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnector" }
tomcat-annotations = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
