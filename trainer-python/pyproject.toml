[project]
name = "pika-trainer"
version = "0.0.0"
description = "PPO trainer for Pikachu Volleyball RL (ROADMAP Phase 2+)"
requires-python = ">=3.11"
dependencies = []

# Phase 2 이후에 torch / gymnasium / grpcio 가 여기에 들어온다.
# 이 작업(Phase 0~1)에서는 골격만 세운다.

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pika_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
