[project]
name = "pika-trainer"
version = "0.0.0"
description = "PPO trainer for Pikachu Volleyball RL (ROADMAP Phase 2+)"
# numpy 2.5.x 가 3.12+ 를 요구한다. torch(Phase 3) 도 3.12 를 지원하므로 여기서 올린다.
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "grpcio>=1.84.0",
    "numpy>=2.5.3",
    "torch>=2.9.0",
]

# ⚠️ torch 는 **CPU 휠로 잠근다** (NFR-5).
#    PyPI 기본 `torch` 는 Linux 에서 CUDA 런타임(nvidia-*, 약 2.5GB)을 끌고 온다.
#    macOS arm64 휠은 원래 CPU+MPS 뿐이므로 기본 인덱스 그대로 둔다.
#    `explicit = true` 는 "여기서 받을 패키지를 tool.uv.sources 가 지목한 것으로 한정"
#    한다 — 다른 의존성의 해석을 오염시키지 않는다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # .proto → Python stub 생성기. 생성 결과는 커밋하고, 테스트가 최신인지 확인한다.
    "grpcio-tools>=1.84.0",
]
export = [
    "onnx==1.23.0",
    "onnxruntime==1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pika_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# export(Phase 5)도 기본으로 설치한다 — `uv run pytest` 가 ONNX 결정론 · 자기 검증 테스트를 건너뛰지 않게.
default-groups = ["dev", "export"]
