// gRPC 계약 — Python 학습기 ↔ Kotlin 엔진. (FR-11, plan.md §7)
//
// ─────────────────────────────────────────────────────────────────────────────
// 왜 repeated float 가 아니라 packed bytes 인가
// ─────────────────────────────────────────────────────────────────────────────
// protobuf 의 `repeated float` 는 Python 에서 리스트로 풀린다. N=256 · 슬롯 2 · 40차원이면
// 원소가 20,480개이고, 그만큼의 파이썬 객체가 스텝마다 생긴다. 목표 처리량의 배치 예산은
// 5.12 ms 인데 (50,000 env-step/s, N=256) 그것으로는 예산이 바로 날아간다.
//
// `bytes` 로 받으면 클라이언트는 이 한 줄이면 된다:
//   np.frombuffer(reply.observations, dtype='<f4').reshape(num_envs, slot_count, obs_dim)
// 복사는 한 번뿐이고 파이썬 객체는 배열 하나다.
//
// 대신 **레이아웃이 계약이 된다.** 그래서:
//   1. 관측 필드 순서는 proto/obs_spec.proto 가 단일 정의한다 (NFR-5).
//   2. Health 가 레이아웃 해시를 돌려주고 클라이언트가 자기 해시와 대조한다.
//      버전이 어긋난 서버에 붙으면 관측이 조용히 뒤섞이는 대신 **즉시 실패**한다.
//
// ─────────────────────────────────────────────────────────────────────────────
// 바이트 레이아웃 (전부 little-endian)
// ─────────────────────────────────────────────────────────────────────────────
//   actions      uint8   num_envs × slot_count           행동 하나가 1바이트 (Discrete(18))
//   observations float32 num_envs × slot_count × obs_dim obs_spec.proto 의 필드 순서
//   rewards      float32 num_envs × slot_count           가중 합계
//   terminated   uint8   num_envs                        랠리 종료
//   truncated    uint8   num_envs                        max_rally_frames 초과
//   reward_terms float32 num_envs × slot_count × 5       항별 값 (info 용, FR-6)
//   scores       int32   num_envs × 2                    [player1, player2] 진영 순서
//
// ─────────────────────────────────────────────────────────────────────────────
// 오토리셋 (Gymnasium 1.x, plan.md §8.2)
// ─────────────────────────────────────────────────────────────────────────────
// **next-step autoreset 이다.** terminated=1 인 스텝은 랠리의 마지막 관측을 돌려주고
// 리셋하지 않는다. 그 **다음** Step 호출이 시작될 때 리셋하며, 그 호출의 행동은 버려지고
// 보상은 0 이다. 구 API 의 same-step autoreset 으로 읽으면 PPO 의 부트스트랩이
// 조용히 틀어진다.

syntax = "proto3";

package pika.env.v1;

option java_package = "pika.env.v1";
option java_multiple_files = true;
option java_outer_classname = "EnvProto";

service PikaEnv {
  // 벡터 크기·슬롯 구성·플래그를 정한다. 기존 상태는 버려진다.
  rpc Configure (ConfigureRequest) returns (ConfigureReply);

  // 전부 처음 상태로. 반환은 Step 과 같은 모양이며 보상·플래그는 0 이다.
  rpc Reset (ResetRequest) returns (StepReply);

  rpc Step (StepRequest) returns (StepReply);

  // 버전·관측 레이아웃 해시·누적 처리량. 클라이언트가 붙자마자 대조한다.
  rpc Health (HealthRequest) returns (HealthReply);
}

enum SlotKind {
  // 지정하지 않으면 서버 기본값: p1 = EXTERNAL, p2 = FSM (Track A).
  SLOT_KIND_UNSPECIFIED = 0;
  // 외부 정책. 행동을 주고 관측을 받는다.
  SLOT_KIND_EXTERNAL = 1;
  // 엔진 내장 FSM. 행동을 받지 않고 관측도 내보내지 않는다.
  SLOT_KIND_FSM = 2;
}

// 항의 부호는 항 안에 있다 (rally_win 은 ±1, time_penalty 는 프레임당 -1).
// 가중치는 **크기**다. 음수를 넣으면 페널티가 보상이 된다.
message RewardWeights {
  float rally_win = 1;
  float ball_touch = 2;
  float crossed_net = 3;
  float opponent_miss = 4;
  float time_penalty = 5;
}

// optional 인 필드는 **비워 두면 서버 기본값**이다.
// proto3 의 0/false 는 "지정 안 함" 과 구별되지 않으므로, 기본값이 0/false 가 아닌
// 필드는 전부 optional 로 둔다. (mirror_observations 의 기본은 true 다.)
message ConfigureRequest {
  int32 num_envs = 1;
  int32 base_seed = 2;
  SlotKind p1 = 3;
  SlotKind p2 = 4;
  optional int32 winning_score = 5;             // 기본 15
  optional int32 max_rally_frames = 6;          // 기본 3000, 0 이면 무제한
  optional bool obs_include_expected_landing = 7; // 기본 true
  optional bool obs_include_side_flag = 8;        // 기본 false
  optional bool mirror_observations = 9;          // 기본 true
  optional bool edge_trigger_power_hit = 10;      // 기본 true
  RewardWeights reward_weights = 11;              // 없으면 rally_win=1, 나머지 0
}

message ConfigureReply {
  int32 num_envs = 1;
  int32 slot_count = 2;
  int32 obs_dim = 3;
  string obs_layout_hash = 4;
  // 활성 관측 필드의 이름 (obs_spec.proto 순서). 클라이언트가 자기 목록과 대조한다.
  repeated string obs_field_names = 5;
  repeated string reward_term_names = 6;
  int32 action_count = 7;
}

message ResetRequest {
  // 주면 이 시드로 갈아탄다. 안 주면 Configure 의 base_seed 를 그대로 쓴다.
  optional int32 base_seed = 1;
}

message StepRequest {
  // uint8, num_envs × slot_count. 0..17 범위를 벗어나면 INVALID_ARGUMENT.
  bytes actions = 1;
}

message StepReply {
  bytes observations = 1;
  bytes rewards = 2;
  bytes terminated = 3;
  bytes truncated = 4;
  bytes reward_terms = 5;
  bytes scores = 6;
}

message HealthRequest {}

message HealthReply {
  string version = 1;
  bool configured = 2;
  int32 num_envs = 3;
  int32 slot_count = 4;
  int32 obs_dim = 5;
  // ⚠️ 클라이언트는 이 값을 자기 obs_spec 해시와 대조하고, 다르면 붙기를 포기해야 한다.
  string obs_layout_hash = 6;
  int64 total_env_steps = 7;
  double uptime_seconds = 8;
  // 누적 처리량 = total_env_steps / (스텝에 쓴 시간). 순간값이 아니다.
  double env_steps_per_sec = 9;
  repeated string reward_term_names = 10;
}
